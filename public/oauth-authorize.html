<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMind - Authorize</title>
    <link rel="icon" type="image/svg+xml" href="/assets/openmind-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #07090e;
            --ink: #f3f4f6;
            --ink-soft: #91a8a1;
            --core: #40f2c1;
            --core-dark: #55d8ff;
            --accent-cyan: #55d8ff;
            --accent-purple: #ff6bd5;
            --line: rgba(131, 255, 225, 0.16);
            --surface: rgba(12, 20, 28, 0.82);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            --error: #ef4444;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background:
                linear-gradient(rgba(85, 216, 255, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(64, 242, 193, 0.045) 1px, transparent 1px),
                linear-gradient(145deg, #05070b 0%, #07131a 42%, #111221 100%);
            background-size: 38px 38px, 38px 38px, auto;
            color: var(--ink);
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(115deg, transparent 0 23%, rgba(64, 242, 193, 0.08) 23.2%, transparent 23.8% 62%, rgba(85, 216, 255, 0.06) 62.2%, transparent 62.8%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent 20%, transparent 80%, rgba(64, 242, 193, 0.045));
        }

        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            text-decoration: none;
            color: var(--ink);
        }

        .brand {
            font-weight: 800;
            letter-spacing: 0;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--ink) 30%, var(--ink-soft) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            display: block;
            filter: drop-shadow(0 0 14px rgba(64, 242, 193, 0.48));
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow), 0 0 0 1px rgba(64, 242, 193, 0.06), 0 0 40px rgba(64, 242, 193, 0.08);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-name {
            text-align: center;
            font-size: 0.95rem;
            color: var(--ink-soft);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .app-name strong { color: var(--ink); }

        .permissions {
            background: rgba(2, 4, 8, 0.8);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            color: var(--ink-soft);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .permissions p {
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .permissions ul {
            padding-left: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(2, 4, 8, 0.8);
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--ink);
            font-size: 0.95rem;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        input:focus {
            outline: none;
            border-color: var(--core);
            box-shadow: 0 0 0 3px rgba(64, 242, 193, 0.15), inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-approve {
            background: linear-gradient(135deg, var(--core) 0%, var(--core-dark) 100%);
            color: #04100e;
            box-shadow: 0 4px 18px rgba(64, 242, 193, 0.28);
        }

        .btn-approve:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(85, 216, 255, 0.34);
        }

        .btn-deny {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
        }

        .btn-deny:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--error);
            color: var(--error);
        }

        .error {
            color: #fca5a5;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
            display: none;
            line-height: 1.4;
        }

        .error.visible { display: block; }
    </style>
</head>
<body>
    <div style="width: 100%; max-width: 440px;">
        <a class="brand-container" href="/">
            <img class="brand-icon" src="/assets/openmind-logo.svg" alt="" width="32" height="32">
            <span class="brand">OpenMind</span>
        </a>
        <div class="auth-card">
            <h1>App Authorization</h1>
            <p class="app-name">
                <strong id="clientName">An application</strong> wants to access your OpenMind memory cortex.
            </p>

            <div class="permissions">
                <p>This will allow the app to:</p>
                <ul>
                    <li>Read your thoughts and memories</li>
                    <li>Save new thoughts on your behalf</li>
                    <li>Search your memory</li>
                </ul>
            </div>

            <form id="authForm">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">

                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">

                <div class="btn-row">
                    <button type="submit" class="btn btn-approve">Authorize</button>
                    <button type="button" class="btn btn-deny" id="denyBtn">Deny</button>
                </div>
                <div id="errorMsg" class="error"></div>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const clientId = params.get('client_id') || '';
        const redirectUri = params.get('redirect_uri') || '';
        const scope = params.get('scope') || 'read write';
        const state = params.get('state') || '';
        const codeChallenge = params.get('code_challenge') || '';
        const codeChallengeMethod = params.get('code_challenge_method') || '';

        if (clientId) {
            document.getElementById('clientName').textContent = clientId;
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await doAuth('approve');
        });

        document.getElementById('denyBtn').addEventListener('click', async () => {
            await doAuth('deny');
        });

        async function doAuth(action) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.className = 'error';

            try {
                const res = await fetch('/oauth/authorize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        client_id: clientId,
                        redirect_uri: redirectUri,
                        scope,
                        state,
                        code_challenge: codeChallenge,
                        code_challenge_method: codeChallengeMethod,
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        action
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.redirect) {
                        window.location.assign(data.redirect);
                        return;
                    }
                    errorMsg.textContent = 'Authorization completed without a redirect target.';
                    errorMsg.className = 'error visible';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.error || 'Authorization failed';
                    errorMsg.className = 'error visible';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error';
                errorMsg.className = 'error visible';
            }
        }
    </script>
</body>
</html>
